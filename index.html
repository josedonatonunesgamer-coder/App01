<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Finanças</title>
    <!-- Fonte moderna do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --success: #10B981;
            --danger: #EF4444;
            --dark: #1F2937;
            --light: #F3F4F6;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            color: var(--primary);
        }

        /* Cartões de Resumo */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            font-size: 1rem;
            color: #6B7280;
            font-weight: 400;
        }

        .card p {
            font-size: 1.8rem;
            font-weight: 600;
            margin-top: 10px;
        }

        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-primary { color: var(--primary); }

        /* Formulário */
        .form-container {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        input, select, button {
            padding: 12px 15px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            flex: 1;
            min-width: 150px;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: var(--white);
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #4338CA;
        }

        /* Lista de Transações */
        .transactions {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #E5E7EB;
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .transaction-info {
            display: flex;
            flex-direction: column;
        }

        .transaction-title {
            font-weight: 500;
        }

        .transaction-date {
            font-size: 0.8rem;
            color: #6B7280;
        }

        .transaction-value {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .delete-btn {
            background: #FEE2E2;
            color: var(--danger);
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.9rem;
            min-width: auto;
        }

        .delete-btn:hover {
            background: #FECACA;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Minhas Finanças</h1>
        </header>

        <div class="dashboard">
            <div class="card">
                <h3>Entradas</h3>
                <p class="text-success" id="incomeDisplay">R$ 0,00</p>
            </div>
            <div class="card">
                <h3>Saídas</h3>
                <p class="text-danger" id="expenseDisplay">R$ 0,00</p>
            </div>
            <div class="card">
                <h3>Saldo Atual</h3>
                <p class="text-primary" id="totalDisplay">R$ 0,00</p>
            </div>
        </div>

        <form class="form-container" id="transactionForm">
            <input type="text" id="descInput" placeholder="Descrição (ex: Mercado)" required>
            <input type="number" id="amountInput" placeholder="Valor (R$)" step="0.01" required>
            <select id="typeInput">
                <option value="income">Entrada (+)</option>
                <option value="expense">Saída (-)</option>
            </select>
            <button type="submit">Adicionar</button>
        </form>

        <div class="transactions" id="transactionList">
            <!-- As transações aparecerão aqui via JavaScript -->
        </div>
    </div>

    <script>
        // Recupera dados salvos ou inicia array vazio
        let transactions = JSON.parse(localStorage.getItem('finances')) || [];

        const formatCurrency = (value) => {
            return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        };

        const updateDashboard = () => {
            const income = transactions
                .filter(t => t.type === 'income')
                .reduce((acc, t) => acc + t.amount, 0);
            
            const expense = transactions
                .filter(t => t.type === 'expense')
                .reduce((acc, t) => acc + t.amount, 0);
            
            const total = income - expense;

            document.getElementById('incomeDisplay').innerText = formatCurrency(income);
            document.getElementById('expenseDisplay').innerText = formatCurrency(expense);
            document.getElementById('totalDisplay').innerText = formatCurrency(total);
            
            // Muda cor do saldo se negativo
            document.getElementById('totalDisplay').className = total >= 0 ? 'text-primary' : 'text-danger';
        };

        const renderTransactions = () => {
            const list = document.getElementById('transactionList');
            list.innerHTML = '';

            transactions.forEach((t, index) => {
                const isIncome = t.type === 'income';
                const sign = isIncome ? '+' : '-';
                const colorClass = isIncome ? 'text-success' : 'text-danger';

                const item = document.createElement('div');
                item.className = 'transaction-item';
                item.innerHTML = `
                    <div class="transaction-info">
                        <span class="transaction-title">${t.desc}</span>
                        <span class="transaction-date">${t.date}</span>
                    </div>
                    <div class="transaction-value">
                        <span class="${colorClass}">${sign} ${formatCurrency(t.amount)}</span>
                        <button class="delete-btn" onclick="deleteTransaction(${index})">X</button>
                    </div>
                `;
                list.appendChild(item);
            });
        };

        const addTransaction = (e) => {
            e.preventDefault();
            const desc = document.getElementById('descInput').value;
            const amount = parseFloat(document.getElementById('amountInput').value);
            const type = document.getElementById('typeInput').value;
            
            const date = new Date().toLocaleDateString('pt-BR');

            transactions.push({ desc, amount, type, date });
            saveAndUpdate();
            
            document.getElementById('transactionForm').reset();
        };

        const deleteTransaction = (index) => {
            transactions.splice(index, 1);
            saveAndUpdate();
        };

        const saveAndUpdate = () => {
            localStorage.setItem('finances', JSON.stringify(transactions));
            updateDashboard();
            renderTransactions();
        };

        // Event Listener do Formulário
        document.getElementById('transactionForm').addEventListener('submit', addTransaction);

        // Inicialização
        updateDashboard();
        renderTransactions();
    </script>
</body>
</html>
